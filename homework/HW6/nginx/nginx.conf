events {}

http {
  include /etc/nginx/mime.types;
  upstream node_api { server backend-node:3000; }
  upstream python_api { server backend-python:5000; }
  upstream rust_api { server backend-rust:8000; }

  server {
    listen 80;
    server_name localhost;

    # 前端靜態頁
    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }

    # Node.js API: /api/* -> backend-node
    location /api/ {
      proxy_pass http://node_api/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Python: /python/* -> backend-python (去掉前綴)
    location /python/ {
      proxy_pass http://python_api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Rust: /rust/* -> backend-rust
    location /rust/ {
      proxy_pass http://rust_api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康檢查
    location /nginx-health {
      access_log off;
      return 200 'nginx ok';
      add_header Content-Type text/plain;
    }
  }
}
