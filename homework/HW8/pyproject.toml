[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xfrescue"
version = "0.1.0"
description = "Polite, resumable XenForo preservation toolkit"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "xfrescue contributors" }]
dependencies = []

[project.scripts]
xfrescue = "xfrescue.cli:main"

[tool.setuptools.packages.find]
include = ["xfrescue*"]
