[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cafeteria-sim"
version = "0.1.1"
description = "Discrete-event simulation and staffing optimization for school cafeteria queues"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cafeteria-sim contributors" }]
keywords = [
  "simpy",
  "discrete-event-simulation",
  "queueing",
  "operations-research",
  "cafeteria",
  "staffing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
  "Topic :: Scientific/Engineering",
]
dependencies = ["simpy>=4.1,<5"]

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5.1"]

[project.scripts]
cafeteria-sim = "cafeteria_sim.cli:main"

[project.urls]
Homepage = "https://pypi.org/project/cafeteria-sim/"
Repository = "https://github.com/yi-ning-huang/_se"
Issues = "https://github.com/yi-ning-huang/_se/issues"

[tool.setuptools.packages.find]
include = ["cafeteria_sim*"]

[tool.setuptools.package-data]
cafeteria_sim = ["py.typed"]
